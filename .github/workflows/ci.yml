name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Start local Supabase
        run: npm run supabase:test:start

      - name: Configure integration test environment
        run: |
          npx supabase status -o env \
            --override-name api.url=INTEGRATION_SUPABASE_URL \
            --override-name db.url=INTEGRATION_DATABASE_URL \
            --override-name auth.anon_key=INTEGRATION_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=INTEGRATION_SUPABASE_SERVICE_ROLE_KEY \
            > .env.integration.local
          echo "INTEGRATION_ACCOUNT_BAN_HASH_SECRET=ci-integration-test-secret-32-characters" >> .env.integration.local

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:test:stop

      - name: Build application
        run: npm run build
